name: Rardar candidate Linux artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed 40-character source commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate-artifact:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'codex/server-promote-budget-handoff' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            memory=5g
            memory-swap=5g
            cpu-period=100000
            cpu-quota=200000
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - name: Build and inspect isolated Linux images (no deployment)
        shell: bash
        run: bash scripts/build_rardar_release.sh
      - name: Preserve exact candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: rardar-candidate-${{ env.SOURCE_SHA }}-linux-amd64
          path: ${{ runner.temp }}/rardar-release-output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
