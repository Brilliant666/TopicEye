# Alembic configuration for TopicEye.
#
# sqlalchemy.url is intentionally empty - env.py injects the sync URL derived
# from settings.DATABASE_URL (SQLite or PostgreSQL). Never commit credentials here.

[alembic]
# path to migration scripts (relative to this ini file via %(here)s)
script_location = %(here)s/alembic

# Make `app.*` importable from env.py. %(here)s is the directory of this ini.
prepend_sys_path = .

# filename template for generated revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

version_path_separator = os

# left empty; env.py reads settings.DATABASE_URL and converts to a sync URL
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
