# Fixed Rardar vhost, not the generic TopicEye template. Existing TLS,
# proxying, limits and private fallback are retained; no credentials live here.
server {
    listen 80;
    listen [::]:80;
    server_name rardar.dokitool.com;

    access_log /var/log/nginx/rardar.access.log combined;
    error_log /var/log/nginx/rardar.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rardar.dokitool.com;

    ssl_certificate /etc/letsencrypt/live/rardar.dokitool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rardar.dokitool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/rardar.access.log combined;
    error_log /var/log/nginx/rardar.error.log warn;

    auth_basic $rardar_access_realm;
    auth_basic_user_file /etc/nginx/.htpasswd-rardar;

    limit_req_status 429;
    limit_req zone=rardar_general burst=40 nodelay;
    client_max_body_size 1m;

    add_header Set-Cookie "aihot_admin=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    add_header Set-Cookie "aihot_oauth_state=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rardar_connection_upgrade;
    proxy_set_header Authorization "";
    proxy_redirect off;
    proxy_buffering off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;

    location = /api/actions {
        limit_req zone=rardar_general burst=40 nodelay;
        limit_req zone=rardar_write burst=6 nodelay;
        proxy_pass http://127.0.0.1:13000;
    }

    location = /api/feedback {
        limit_req zone=rardar_general burst=40 nodelay;
        limit_req zone=rardar_write burst=6 nodelay;
        proxy_pass http://127.0.0.1:13000;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
    }
}
