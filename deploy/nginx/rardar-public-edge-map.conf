# Rardar only. Loaded in nginx's http context; the HTTPS vhost uses
# auth_basic $rardar_access_realm. Unlisted methods/paths keep existing Basic.
# "off" removes edge Basic only: application session/owner/admin checks remain.
map "$request_method:$uri" $rardar_access_realm {
    default Rardar;

    ~^(?:GET|HEAD):/(?:historical-hot|find|activity|login|rardar-foundation)?$ off;
    # Retired product URLs render only their existing paused explanation.
    ~^(?:GET|HEAD):/(?:news|discover|candidates|watchlist)$ off;
    ~^(?:GET|HEAD):/project/stable/[A-Za-z0-9_-]+$ off;
    ~^(?:GET|HEAD):/project/github/[0-9]+$ off;
    ~^(?:GET|HEAD):/_next/static/[-A-Za-z0-9_./()@\[\]]+$ off;
    ~^(?:GET|HEAD):/(?:favicon\.ico|icon\.png|apple-icon\.png|robots\.txt|sitemap\.xml|window\.svg|vercel\.svg|next\.svg|globe\.svg|file\.svg)$ off;

    ~^(?:GET|HEAD):/api/v1/rardar/(?:trending-today|historical-hot)$ off;
    ~^(?:GET|HEAD):/api/v1/rardar/(?:trending-projects|historical-projects|project-insights)/[A-Za-z0-9_-]+$ off;
    ~^(?:GET|HEAD):/api/v1/rardar/projects/[0-9]+$ off;

    # Password login only. Registration, email codes and OAuth are not opened.
    ~^GET:/api/v1/auth/me$ off;
    ~^POST:/api/v1/auth/(?:login|refresh|logout)$ off;

    # Private Find reads still require the trusted application user/owner.
    ~^GET:/api/v1/rardar/find-runs(?:/[A-Za-z0-9_-]+|/by-key/[A-Za-z0-9_-]+)?$ off;
    ~^POST:/api/v1/rardar/(?:find-projects|find-runs)$ off;
    ~^POST:/api/v1/rardar/find-runs/[A-Za-z0-9_-]+/execute$ off;

    # Both current and retained model entry points enforce application auth.
    ~^POST:/api/v1/rardar/project-insights/[A-Za-z0-9_-]+$ off;
    ~^POST:/api/v1/rardar/projects/(?:explain|[0-9]+/insight)$ off;
}

map $http_upgrade $rardar_connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=rardar_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rardar_write:10m rate=2r/s;
