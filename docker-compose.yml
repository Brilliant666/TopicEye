services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/topiceye.db}
      - DATABASE_SQLITE_DOMAIN_SPLIT_ENABLED=${DATABASE_SQLITE_DOMAIN_SPLIT_ENABLED:-false}
      - DATABASE_SQLITE_DOMAIN_DIR=${DATABASE_SQLITE_DOMAIN_DIR:-./data/domains}
      - DUCKDB_THREADS=${DUCKDB_THREADS:-2}
      - DUCKDB_MEMORY_LIMIT=${DUCKDB_MEMORY_LIMIT:-256MB}
      - DUCKDB_EXTENSION_DIR=${DUCKDB_EXTENSION_DIR:-./data/duckdb_extensions}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-deepseek/deepseek-chat}
      - LLM_FALLBACK_ENABLED=${LLM_FALLBACK_ENABLED:-false}
      - LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER:-openai}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY:-}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-openai/gpt-4o-mini}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-topiceye}
      - POSTGRES_USER=${POSTGRES_USER:-topiceye}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-topiceye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  postgres-data:
